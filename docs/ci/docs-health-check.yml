name: Documentation Health Check

# This workflow validates documentation governance compliance
# Copy this file to .github/workflows/docs-health-check.yml in your repository

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'docs-manifest.yml'
      - 'README.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/docs-health-check.yml'
  workflow_dispatch:

jobs:
  health-check:
    name: Run Documentation Health Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Clone platform repository
        run: |
          git clone https://github.com/Application-Management-Division/engineering-knowledge-platform_CSO.git /tmp/platform
      
      - name: Install dependencies
        run: |
          pip install -r /tmp/platform/health-assessment/requirements.txt
      
      - name: Run health assessment
        id: health-check
        run: |
          python /tmp/platform/health-assessment/assess.py \
            --repo ${{ github.workspace }} \
            --output /tmp/health-report.md
          
          # Capture exit code but don't fail the workflow yet
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Read health report
        id: report
        run: |
          {
            echo 'report<<EOF'
            cat /tmp/health-report.md
            echo EOF
          } >> $GITHUB_OUTPUT
      
      - name: Comment PR with health report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.report.outputs.report }}`;
            const exitCode = parseInt('${{ steps.health-check.outputs.exit_code }}');
            
            const header = exitCode === 0
              ? '✅ Documentation Health Check Passed'
              : '❌ Documentation Health Check Failed';
            
            const body = `## ${header}\n\n${report}\n\n---\n*Generated by [Engineering Knowledge Platform](https://github.com/Application-Management-Division/engineering-knowledge-platform_CSO)*`;
            
            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Documentation Health Check')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
      
      - name: Fail if health check failed
        if: steps.health-check.outputs.exit_code != '0'
        run: |
          echo "::error::Documentation health check failed. See the PR comment for details."
          exit 1
